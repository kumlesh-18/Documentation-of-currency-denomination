<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#gradient1)" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Currency Symbols -->
  <g transform="translate(32, 25)">
    <text x="-10" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">₹</text>
    <text x="2" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">$</text>
  </g>
  
  <!-- Bills -->
  <g transform="translate(32, 42)">
    <rect x="-14" y="-3" width="28" height="8" rx="1.5" fill="#60a5fa" opacity="0.7"/>
    <rect x="-14" y="0" width="28" height="8" rx="1.5" fill="#93c5fd" stroke="#ffffff" stroke-width="0.5"/>
  </g>
</svg>
