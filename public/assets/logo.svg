<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#gradient1)" stroke="#1e40af" stroke-width="3"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Currency Symbol Stack -->
  <g transform="translate(100, 85)">
    <!-- Dollar Sign -->
    <text x="-25" y="0" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff" opacity="0.9">$</text>
    <!-- Rupee Sign -->
    <text x="-5" y="0" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff" opacity="0.95">₹</text>
    <!-- Euro Sign -->
    <text x="15" y="0" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">€</text>
  </g>
  
  <!-- Currency Notes/Bills Representation -->
  <g transform="translate(100, 130)">
    <!-- Back bill -->
    <rect x="-35" y="-8" width="70" height="20" rx="3" fill="#3b82f6" opacity="0.6"/>
    <!-- Middle bill -->
    <rect x="-35" y="-4" width="70" height="20" rx="3" fill="#60a5fa" opacity="0.8"/>
    <!-- Front bill -->
    <rect x="-35" y="0" width="70" height="20" rx="3" fill="#93c5fd" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Bill details -->
    <rect x="-30" y="5" width="10" height="10" rx="1" fill="#2563eb" opacity="0.7"/>
    <line x1="-15" y1="7" x2="25" y2="7" stroke="#2563eb" stroke-width="2" opacity="0.7"/>
    <line x1="-15" y1="13" x2="15" y2="13" stroke="#2563eb" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- Distribution Arrows -->
  <g transform="translate(100, 100)" opacity="0.3">
    <!-- Arrow 1 -->
    <path d="M 0,-40 L -30,-60" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-30,-60 -35,-55 -25,-55" fill="#ffffff"/>
    
    <!-- Arrow 2 -->
    <path d="M 0,-40 L 30,-60" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <polygon points="30,-60 35,-55 25,-55" fill="#ffffff"/>
    
    <!-- Arrow 3 -->
    <path d="M -40,0 L -60,-20" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-60,-20 -65,-15 -55,-15" fill="#ffffff"/>
  </g>
</svg>
